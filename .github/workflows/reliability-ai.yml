# Every night: the full check with AI on the 80 test drafts, scored and saved, so the Reliability page's
# trend line updates by itself. Needs the repository secret GROQ_API_KEY (Settings > Secrets and
# variables > Actions); without it the job says so and does nothing. Runs paced to stay inside the free AI
# limit (about 8 minutes).
name: Reliability with AI

on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Is there an AI key?
        id: key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "No GROQ_API_KEY secret: skipping. Add it to run this nightly." >> "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.key.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Score the test drafts with AI
        if: steps.key.outputs.ok == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run --mode ai --save | tail -30 >> "$GITHUB_STEP_SUMMARY"
      - name: Save the results
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "reliability-bot"
          git config user.email "reliability-bot@users.noreply.github.com"
          git add evals/results
          git diff --cached --quiet || git commit -m "Nightly reliability run with AI"
          git push
