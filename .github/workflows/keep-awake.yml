# Render's free server sleeps after 15 minutes without visits, and Supabase pauses a free
# project after a week without activity. During the day (IST) this pings the API, which runs
# one tiny database query. Disable it in the Actions tab, or delete this file, after judging.
name: Keep demo awake

on:
  schedule:
    - cron: "*/14 3-17 * * *"   # every 14 minutes, 03:00-17:59 UTC = 08:30-23:29 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://brandguard-api-qtj3.onrender.com/api/ping
