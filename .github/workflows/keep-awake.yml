# Render's free server sleeps after 15 minutes without visits, and Supabase pauses a free
# project after a week without activity. During judging (Round 3) this pings the API around the
# clock; the ping runs one tiny database query. One always-on free service uses about 744 of
# Render's 750 free hours a month, so this fits. After judging, go back to daytime only
# (cron "*/14 3-17 * * *", 08:30-23:29 IST) or disable it in the Actions tab.
name: Keep demo awake

on:
  schedule:
    - cron: "*/13 * * * *"   # every 13 minutes, day and night
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://brandguard-api-qtj3.onrender.com/api/ping
